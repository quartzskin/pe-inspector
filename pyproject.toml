[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-inspector"
version = "0.1.0"
description = "Static PE (.exe/.dll) inspector with a PySide6 GUI and a CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pefile>=2023.2.7", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pe-inspector = "pe_inspector.cli:main"

[project.gui-scripts]
pe-inspector-gui = "pe_inspector.ui.app:main"

[tool.setuptools.packages.find]
include = ["pe_inspector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
